name: DHS Partner v8.20.8 APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find Project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ Project ZIP nahi mili"
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"

          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

      - name: Detect Gradle Project
        run: |
          echo "Searching Gradle project..."

          GRADLEW=$(find project -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "❌ gradlew nahi mila"
            find project -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          chmod +x "$GRADLEW"

          echo "Gradle project: $PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Verify google-services.json
        run: |
          GOOGLE_FILE="$PROJECT_DIR/app/google-services.json"

          if [ ! -f "$GOOGLE_FILE" ]; then
            echo "❌ google-services.json nahi mila:"
            echo "$GOOGLE_FILE"
            exit 1
          fi

          echo "✅ google-services.json found"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew clean assembleDebug --stacktrace

      - name: Find APK
        run: |
          find "$PROJECT_DIR" -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DHS-Partner-v8.20.8
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
